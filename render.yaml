# Render blueprint: one free web service that serves the API, the WebSocket and the built frontend.
services:
  - type: web
    name: tandem
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
